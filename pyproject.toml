[project]
name = "mikrotik-mcp"
version = "0.3.0"
description = "MCP server for MikroTik RouterOS, over the binary API — addresses items by their real .id, never by list position."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stefan Knol", email = "mail@sknol.nl" }]
keywords = ["mcp", "model-context-protocol", "mikrotik", "routeros", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.2.0",
    "librouteros>=3.4.1",
]

[project.optional-dependencies]
# No `mcphub` extra. `mcphub.plugins.base` is supplied by the hub itself, which
# is what imports `mikrotik_mcp.plugin` in the first place — and the `mcphub`
# name on PyPI belongs to an unrelated project, so declaring it as a dependency
# installed something that could never provide that module.
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/StefanKnol/mikrotik-mcp"
Issues = "https://github.com/StefanKnol/mikrotik-mcp/issues"

# Run it from any MCP client: `uvx mikrotik-mcp`.
[project.scripts]
mikrotik-mcp = "mikrotik_mcp.__main__:main"

# Or let mcphub load it in-process, with typed settings fields.
[project.entry-points."mcphub.plugins"]
mikrotik = "mikrotik_mcp.plugin:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mikrotik_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
