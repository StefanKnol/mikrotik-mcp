name: CI & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      registry_version:
        description: "Publish this already-released version to the MCP registry, e.g. 0.2.0. Leave blank to just run the tests."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q

  smoke:
    name: Launch as an MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Start the installed console script and list its tools
        # The package is consumed by being *launched*, so building and importing
        # it is not enough — this exercises the entry point the way a client does.
        run: |
          uv run python - <<'PY'
          import asyncio, os, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(
                  command=".venv/bin/mikrotik-mcp",
                  env={**os.environ, "MIKROTIK_HOST": "192.0.2.1",
                       "MIKROTIK_USERNAME": "u", "MIKROTIK_PASSWORD": "p",
                       "MIKROTIK_TIMEOUT": "1"},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as s:
                      info = (await s.initialize()).server_info
                      tools = (await s.list_tools()).tools
                      names = {t.name for t in tools}
                      print(f"{info.name} {info.version}: {len(tools)} tools")
                      # Named, not counted: a count says a tool vanished without
                      # saying which one.
                      required = {"list_firewall_rules", "move_firewall_rule",
                                  "add_firewall_rule", "update_firewall_rule",
                                  "list_address_lists", "list_address_list_entries",
                                  "move_nat_rule", "update_nat_rule", "update_dns_static"}
                      assert required <= names, f"missing: {sorted(required - names)}"
                      # 192.0.2.1 is TEST-NET-1 and never answers, so this proves
                      # an unreachable router still yields a usable server.
                      r = await s.call_tool("system_info", {})
                      assert r.is_error, "an unreachable router should report a tool error"
                      print("unreachable router handled:", r.content[0].text[:80])
          asyncio.run(main())
          PY

  publish:
    name: Publish to PyPI
    needs: [test, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no API token to store, rotate or leak.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: The tag and the version inside it must agree
        # Nothing else enforces this. A v0.3.0 tag on a tree that still says
        # 0.2.0 builds and uploads 0.2.0, so the release goes out under a number
        # nobody chose and server.json points at a PyPI version that will never
        # exist. Checked before the build, so a mismatch costs nothing.
        run: uv run python scripts/release.py "${GITHUB_REF_NAME#v}" --check
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: Publish to the MCP registry
    needs: [publish]
    # `always()` because the dispatch path deliberately skips `publish` — a
    # version already on PyPI does not need uploading again. Without it, a
    # skipped dependency would skip this job too.
    if: |
      always()
      && (needs.publish.result == 'success' || inputs.registry_version != '')
    runs-on: ubuntu-latest
    env:
      # `0.2.0` from a dispatch, `v0.2.0` from a tag; the `v` comes off below.
      VERSION: ${{ inputs.registry_version || github.ref_name }}
    permissions:
      # The registry verifies this workflow's OIDC identity and grants the
      # `io.github.StefanKnol/*` namespace from it. No token to store, and no
      # device-flow login to sit through on every release.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Publish the manifest as it stood at that release, not as main
          # happens to look now.
          ref: ${{ inputs.registry_version && format('v{0}', inputs.registry_version) || github.ref }}

      - name: The manifest must name the version being published
        # The tag path already checked this before building. The dispatch path
        # has not, and naming a version the manifest disagrees with is exactly
        # the mistake this is here to catch.
        run: |
          version="${VERSION#v}"
          for got in $(jq -r '.version, .packages[].version' server.json); do
            if [ "$got" != "$version" ]; then
              echo "::error::server.json says ${got}, but publishing ${version}"
              exit 1
            fi
          done
          echo "server.json agrees on ${version}"

      - name: Wait for PyPI to serve this version
        # The registry refuses an entry whose package it cannot fetch, and
        # PyPI's JSON API lags the upload by some seconds — so publishing
        # straight after the upload job races it and loses often enough to
        # matter. Poll the exact URL the registry will use.
        run: |
          version="${VERSION#v}"
          url="https://pypi.org/pypi/mikrotik-mcp/${version}/json"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "$url"; then
              echo "PyPI is serving ${version} after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: ${version} not on PyPI yet"
            sleep 10
          done
          echo "::error::PyPI did not serve ${version} within five minutes" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate by OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
